name: Publicar vista de GASTROORIGEN

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'assets/branding/splash_hq_part*.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruir portada HQ GASTROORIGEN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/assets
          cat assets/branding/splash_hq_part{01..13}.txt | tr -d '\r\n ' | base64 --decode > preview/assets/splash.webp
          BYTES=$(stat -c%s preview/assets/splash.webp)
          echo "Portada HQ reconstruida: ${BYTES} bytes"
          test "${BYTES}" -gt 60000
          file preview/assets/splash.webp | tee /tmp/splash-file.txt
          grep -qi 'Web/P image\|WebP' /tmp/splash-file.txt
          sed -i 's/splash-portada-fix3/splash-hq-v2/g' preview/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
