name: Publicar vista de GASTROORIGEN

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'assets/branding/splash_hq_part*.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar portada limpia GASTROORIGEN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/assets
          cat assets/branding/splash_hq_part{01..13}.txt | tr -d '\r\n ' | base64 --decode > /tmp/splash-source.webp

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path

          source = Path('/tmp/splash-source.webp')
          target = Path('preview/assets/splash-clean-v1.png')

          with Image.open(source) as opened:
              opened.load()
              image = opened.convert('RGB')

          width, height = image.size

          # El fondo se calcula desde una zona verde limpia de la propia portada
          # para que la corrección no introduzca un cambio visible de tono.
          sample = image.crop((0, 0, max(20, width // 5), max(20, height // 10)))
          median = ImageStat.Stat(sample).median
          background = tuple(int(v) for v in median[:3])

          fade_start = int(height * 0.69)
          solid_start = int(height * 0.77)

          clean = image.copy()
          fade_height = max(1, solid_start - fade_start)
          overlay = Image.new('RGB', (width, fade_height), background)
          mask = Image.new('L', (width, fade_height))
          pixels = mask.load()
          for y in range(fade_height):
              alpha = round(255 * (y / max(1, fade_height - 1)))
              for x in range(width):
                  pixels[x, y] = alpha

          clean.paste(overlay, (0, fade_start), mask)
          clean.paste(Image.new('RGB', (width, height - solid_start), background), (0, solid_start))
          clean.save(target, format='PNG', optimize=True)

          print(f'Portada limpia: {width}x{height} · {target.stat().st_size} bytes')
          if width < 900 or height < 1600:
              raise SystemExit('Resolución de portada insuficiente')
          if target.stat().st_size < 50000:
              raise SystemExit('Archivo de portada inesperadamente pequeño')
          PY

          file preview/assets/splash-clean-v1.png | tee /tmp/splash-file.txt
          grep -qi 'PNG image data' /tmp/splash-file.txt

          # URL nueva: evita que Chrome reutilice cualquier WebP dañado anterior.
          sed -i 's#assets/splash.webp#assets/splash-clean-v1.png#g' preview/index.html
          sed -i 's/splash-portada-fix3/splash-clean-v1/g' preview/index.html
          sed -i 's/splash-hq-v2/splash-clean-v1/g' preview/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
